# Site
name: "thatvirtualboy"
title: "thatvirtualboy"
description: "Indie apps, videos, and articles by That Virtual Boy."
logo: 'assets/favicon.png'
favicon: 'assets/favicon.png'
url: "https://thatvirtualboy.com"
baseurl: ""
google_analytics: 'UA-104130481-1'
disqus: 'thatvirtualboy'
#mailchimp-list: 'https://wowthemes.us11.list-manage.com/subscribe/post?u=8aeb20a530e124561927d3bd8&amp;id=8c3d2d214b'
include: ["_pages"]
permalink: /:title/

# Authors
authors:
  thatvirtualboy:
    name: That Virtual Boy
    display_name: That Virtual Boy
    avatar: 'assets/studio/avatar.webp'
    gravatar: b89e73248ca25117c3c4382cc1da65ab
    email: thatvirtualboy@icloud.com
    web: https://www.thatvirtualboy.com
    twitter: https://x.com/thatvirtualboy
    description: "Author and sole creator of That Virtual Boy and its content including articles, tools, and apps."
  Jeremy McCoy:
    name: Jeremy McCoy
    display_name: Jeremy McCoy
    web: https://github.com/MrDrMcCoy
    twitter: https://twitter.com/nakedhitman
    description: "Guest writer on thatvirtualboy.com."

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives

# Archives
jekyll-archives:
  enabled:
    - category
    - tags
  layout: archive
  permalinks:
    category: '/category/:name/'
    tag: '/tag/:name/'

# Pagination
paginate: 12
paginate_path: /page:num/

# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "enabled"
adsense-data-ad-client: "ca-pub-1603206662881080"
adsense-data-ad-slot: "7898588163"

# Lazy Images ("enabled" or "disabled")
lazyimages: "enabled"

exclude:
  - Preview.command
  - changelog.md
  - LICENSE.txt
  - README.md
  - Gemfile
  - Gemfile.lock
  - Gemfile.lock.lock
  # Retired promo materials. The app pages use the gallery and video in assets/studio.
  - assets/images/pixelpaws/sneakpeakvid.mp4
  - assets/images/pixelpaws/howtovid.mp4
  - assets/images/bentovision/bentovision[1-6].png
  - assets/images/bento/bentocraft-appstore-[1-4].png
  - assets/images/hellothere/appstore-screen*.png
