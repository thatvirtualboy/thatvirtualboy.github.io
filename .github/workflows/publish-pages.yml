name: Publish Jekyll site
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v6
        with:
          # A queued run should build the current branch, including any newer Shorts.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec jekyll build
      - name: Check the Pages size limit
        run: |
          bytes=$(du --bytes --summarize _site | cut -f1)
          echo "Site size in bytes: $bytes"
          test "$bytes" -le 1000000000
      - name: Archive Pages with Android website association
        run: |
          test -f _site/.well-known/assetlinks.json
          ruby -rjson -e 'JSON.parse(File.read("_site/.well-known/assetlinks.json"))'
          # Preserve the Pages action's hidden-file exclusion, then add only this public directory.
          tar --dereference --hard-dereference --directory _site \
            -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github --exclude=".[^/]*" .
          tar --append --dereference --hard-dereference --directory _site \
            -f "$RUNNER_TEMP/artifact.tar" .well-known
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx '.well-known/assetlinks.json'
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './index.html'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
