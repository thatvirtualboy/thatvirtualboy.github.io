<dialog class="tvb-search" aria-labelledby="search-heading">
  <form method="dialog"><label for="query" id="search-heading">Search the site</label><button aria-label="Close search">×</button></form>
  <input id="query" type="search" placeholder="Search apps, articles, videos…" autocomplete="off">
  <p id="status" role="status"></p>
  <div id="results"></div>
  <button type="button" id="more-results" hidden>Show more results</button>
</dialog>
